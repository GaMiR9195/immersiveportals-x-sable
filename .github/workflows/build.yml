# Сборка мода на GitHub Actions: патченные нативы Rapier под все ОС + один jar.
#
# Нативы собираются так же, как у самого Sable (.github/workflows/build-rust.yml): на ОДНОМ
# ubuntu-раннере, в Docker-образах natives/container/{zigbuild,xwin} (cargo-zigbuild для
# Linux/macOS, cargo-xwin + MSVC для Windows), скриптом natives/build-cross.sh. Раньше здесь
# был отдельный раннер на каждую ОС — Windows/macOS-раннеры каждый раз ломались по-своему
# (MinGW-линкер, предустановленный софт, лимиты macOS), а один хост с закреплёнными образами
# и nightly из natives/rust-toolchain.toml даёт одинаковый результат на каждом запуске.
#
# Задачи:
#   natives — кросс-сборка всех нативов -> артефакт "natives";
#   jar     — раскладывает нативы в проект и собирает jar (gradlew jarJar); в jar'е
#             IplNativesOverrideMixin при запуске сам выбирает библиотеку под ОС/архитектуру;
#   release — только для тегов v*: прикрепляет jar к GitHub Release.
#
# Запуск вручную: Actions -> "Build" -> Run workflow. Подробно — docs/GITHUB_ACTIONS.md.
# У gradlew в репозитории нет бита исполнения — поэтому везде `bash ./gradlew`.
name: Build

on:
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: "Дополнительно собрать нативы Windows aarch64"
        type: boolean
        default: false
      allow_partial:
        description: "Собрать jar, даже если часть нативов не собралась (на этих ОС физика порталов будет выключена)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Новый запуск для той же ветки/тега отменяет старый — не тратим минуты на устаревший коммит.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  natives:
    name: Natives (Docker cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
    steps:
      - uses: actions/checkout@v6

      # Кэшируется только скачанное cargo (registry/git), а не target/: так кэш маленький и
      # не может «протухнуть» между версиями тулчейна. Ключ — тулчейн + Cargo.lock.
      - name: Cache cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            natives/target/docker-cargo/registry
            natives/target/docker-cargo/git
          key: ipl-cargo-${{ hashFiles('natives/rust-toolchain.toml', 'natives/Cargo.lock') }}
          restore-keys: |
            ipl-cargo-

      # Скрипт собирает ВСЕ запрошенные цели, даже если какая-то упала, и выходит с ошибкой в
      # конце — поэтому артефакт ниже загружается в любом случае (if: always()).
      - name: Build natives
        shell: bash
        run: |
          if [ "$WINDOWS_ARM64" = "true" ]; then
            NO_STAGE=1 bash natives/build-cross.sh all
          else
            NO_STAGE=1 bash natives/build-cross.sh
          fi

      # Проверка, что в каждом файле действительно библиотека нужной ОС и архитектуры (страховка
      # от «не той» сборки в jar'е) + таблица в сводке запуска.
      - name: Check natives
        if: always()
        shell: bash
        run: |
          bad=0
          {
            echo "### Natives"
            echo "| file | bytes | sha256 | type |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in natives/out/sable_rapier_*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            kind="$(file -b "$f")"
            case "$name" in
              *_x86_64_linux.so)      want='ELF 64-bit.*x86-64' ;;
              *_aarch64_linux.so)     want='ELF 64-bit.*aarch64' ;;
              *_x86_64_macos.dylib)   want='Mach-O 64-bit.*x86_64' ;;
              *_aarch64_macos.dylib)  want='Mach-O 64-bit.*arm64' ;;
              *_x86_64_windows.dll)   want='PE32\+.*x86-64' ;;
              *_aarch64_windows.dll)  want='PE32\+.*(aarch64|arm64)' ;;
              *)                      want='.' ;;
            esac
            if ! grep -Eiq "$want" <<< "$kind"; then
              echo "::error::$name: unexpected binary type: $kind"
              bad=1
            fi
            echo "| $name | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -c1-16)\` | ${kind:0:70} |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $bad

      - name: Upload natives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natives
          path: natives/out/sable_rapier_*
          if-no-files-found: warn
          retention-days: 14

  jar:
    name: Jar
    needs: natives
    # Обычно jar собирается только при полностью собранных нативах; галочка allow_partial
    # разрешает собрать его с тем, что получилось.
    if: ${{ !cancelled() && (needs.natives.result == 'success' || inputs.allow_partial) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WINDOWS_ARM64: ${{ inputs.windows_arm64 }}
      ALLOW_PARTIAL: ${{ inputs.allow_partial }}
    outputs:
      version: ${{ steps.stage.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Download natives
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: natives
          path: natives/out

      # Раскладка как у natives/build-cross.sh: Windows x86_64 — в src/main/resources/natives_ipl/
      # (копия в корне проиграла бы ей из-за DuplicatesStrategy.EXCLUDE в processResources),
      # остальные — в корень проекта, откуда processResources кладёт их в /natives_ipl/ jar'а.
      - name: Stage natives
        id: stage
        shell: bash
        run: |
          version="$(sed -n 's/^fork_version=//p' gradle.properties | tr -d '\r')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          expected="sable_rapier_x86_64_linux.so sable_rapier_aarch64_linux.so sable_rapier_x86_64_macos.dylib sable_rapier_aarch64_macos.dylib sable_rapier_x86_64_windows.dll"
          [ "$WINDOWS_ARM64" = "true" ] && expected="$expected sable_rapier_aarch64_windows.dll"
          missing=""
          mkdir -p src/main/resources/natives_ipl
          for name in $expected; do
            f="natives/out/$name"
            if [ ! -f "$f" ]; then missing="$missing $name"; continue; fi
            if [ "$name" = sable_rapier_x86_64_windows.dll ]; then
              cp -f "$f" src/main/resources/natives_ipl/
            else
              cp -f "$f" .
            fi
          done
          shopt -s nullglob
          echo "### Natives staged into the jar" >> "$GITHUB_STEP_SUMMARY"
          for f in src/main/resources/natives_ipl/sable_rapier_* sable_rapier_*; do
            echo "- \`$(basename "$f")\` $(stat -c %s "$f") bytes, sha256 \`$(sha256sum "$f" | cut -c1-16)\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$missing" ]; then
            if [ "$ALLOW_PARTIAL" = "true" ]; then
              echo "::warning::missing natives:$missing — on these platforms the mod falls back to stock Sable natives (portal physics off)"
              echo "**Missing:**$missing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::missing natives:$missing"
              exit 1
            fi
          fi

      - name: Build jar
        run: bash ./gradlew jarJar --no-daemon --console=plain --stacktrace

      # Каждая разложенная библиотека обязана оказаться в каждом собранном jar'е.
      - name: Verify jar contents
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          [ "${#jars[@]}" -gt 0 ] || { echo "::error::no jar in build/libs"; exit 1; }
          bad=0
          echo "### Jars" >> "$GITHUB_STEP_SUMMARY"
          # Список пишется в файл: `unzip | grep -q` под pipefail может упасть по SIGPIPE.
          list="$RUNNER_TEMP/jar-entries.txt"
          for jar in "${jars[@]}"; do
            case "$jar" in *-sources.jar|*-javadoc.jar) continue ;; esac
            unzip -Z1 "$jar" > "$list"
            echo "- \`$(basename "$jar")\`: $(grep -c '^natives_ipl/sable_rapier_' "$list" || true) natives" >> "$GITHUB_STEP_SUMMARY"
            for f in src/main/resources/natives_ipl/sable_rapier_* sable_rapier_*; do
              if ! grep -qx "natives_ipl/$(basename "$f")" "$list"; then
                echo "::error::$(basename "$jar") lacks natives_ipl/$(basename "$f")"
                bad=1
              fi
            done
          done
          exit $bad

      - uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-x-sable-${{ steps.stage.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: jar
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: immersive-portals-x-sable-${{ needs.jar.outputs.version }}
          path: dist

      # Релиз создаётся один раз; повторный запуск для того же тега просто перезаливает файлы.
      # Тег с дефисом (v0.6.0-beta.1) публикуется как pre-release.
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            extra=""
            case "$TAG" in *-*) extra="--prerelease" ;; esac
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $extra
          fi
          gh release upload "$TAG" dist/*.jar --clobber
